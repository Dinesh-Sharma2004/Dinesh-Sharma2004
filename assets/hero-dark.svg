<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 246" width="1000" height="246" role="img" aria-labelledby="t">
  <title id="t">Dinesh Sharma - Backend &amp; AI systems engineer</title>
  <style>

    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif; }
    .m { font-family: ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .fg { fill: #e6edf3; } .fg2 { fill: #9198a1; } .fg3 { fill: #636c76; }
    .ac { fill: #58a6ff; } .gr { fill: #3fb950; } .am { fill: #d29922; }
    .b { font-weight: 650; }
    .card { fill: #10151c; stroke: #232b36; stroke-width: 1; }
    .rule { stroke: #1c232d; stroke-width: 1; }
    .wire { fill: none; stroke: #232b36; stroke-width: 1.25; }
    .flow { fill: none; stroke: #58a6ff; stroke-width: 1.25;
             stroke-opacity: .5; stroke-dasharray: 3 7;
             animation: flow 1.9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .rise { opacity: 1; animation: rise .7s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); }
                       to   { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 1; animation: fade .8s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .95; } 50% { opacity: .35; } }
    .halo { animation: halo 2.8s ease-in-out infinite; }
    @keyframes halo { 0% { r: 4; opacity: .55; }
                       70%,100% { r: 11; opacity: 0; } }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 0;
             animation: draw 1.6s ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 1200; }
                       to { stroke-dashoffset: 0; } }
    .caret { animation: caret 1.05s steps(1) infinite; }
    @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .rise, .fade, .pulse, .halo, .draw, .caret, .sweep, .typer, .dot
        { animation: none !important; }
      .halo { opacity: 0; }
    }

    .sweep { animation: sweep 7s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes sweep { 0% { transform: translateX(0); }
                        60%,100% { transform: translateX(1320px); } }

    .typer { animation: typer 2.2s steps(48,end) .35s both; }
    @keyframes typer { from { width: 0; } to { width: 667px; } }
    .dot { animation: run 3.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes run { 0% { cx: 706; opacity: 0; } 8% { opacity: 1; }
                      92% { opacity: 1; } 100% { cx: 946; opacity: 0; } }

  </style>
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#161c24"/>
    </pattern>
  </defs>
  <rect width="1000" height="246" rx="10" fill="url(#pg)"/>
  <rect width="1000" height="246" rx="10" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="999" height="245" rx="9.5"
        fill="none" stroke="#232b36"/>
  <g clip-path="inset(0 round 10px)">
    <rect class="sweep" x="-320" y="0" width="320" height="1.5" fill="url(#sweep)"/>
  </g>
  <rect class="rise" x="22" y="40" width="3" height="34" rx="1.5" fill="#58a6ff"/>
  <text class="b rise" x="40" y="68" font-size="34" fill="#e6edf3" letter-spacing="1.5" style="animation-delay:.05s">DINESH SHARMA</text>
  <text class="m rise" x="41" y="95" font-size="12.5" fill="#58a6ff" letter-spacing="1.2" style="animation-delay:.12s">backend &amp; ai systems engineer</text>
  <defs>
    <mask id="typemask">
      <rect class="typer" x="41" y="112" width="667" height="22" fill="#fff"/>
    </mask>
  </defs>
  <g mask="url(#typemask)">
    <text class="m" x="41" y="128" font-size="13" fill="#9198a1">I build retrieval and LLM-backed services in Python, then containerise and ship them.</text>
  </g>
  <rect class="caret" x="708" y="117" width="7" height="14" fill="#58a6ff" style="animation-delay:2.6s"/>
  <line class="rule" x1="41" y1="156" x2="732" y2="156"/>
  <rect class="rise" style="animation-delay:0.20s" x="41.0" y="172.0" width="158.0" height="17" rx="4" fill="none" stroke="#232b36"/>
  <text class="m fg2" x="48.0" y="184.0" font-size="10">379 contributions / 365d</text>
  <rect class="rise" style="animation-delay:0.27s" x="207.0" y="172.0" width="104.0" height="17" rx="4" fill="none" stroke="#232b36"/>
  <text class="m fg2" x="214.0" y="184.0" font-size="10">21 repositories</text>
  <rect class="rise" style="animation-delay:0.34s" x="319.0" y="172.0" width="158.0" height="17" rx="4" fill="none" stroke="#232b36"/>
  <text class="m fg2" x="326.0" y="184.0" font-size="10">56 technologies detected</text>
  <rect class="rise" style="animation-delay:0.41s" x="485.0" y="172.0" width="104.0" height="17" rx="4" fill="none" stroke="#232b36"/>
  <text class="m fg2" x="492.0" y="184.0" font-size="10">4 active in 30d</text>
  <text class="m fg3" x="41" y="216" font-size="10">GitHub: github.com/Dinesh-Sharma2004 / Portfolio: personal-portfolio-puce-chi-17.vercel.app</text>
  <g class="fade" style="animation-delay:.5s">
    <text class="m fg3" x="978" y="68" font-size="9.5" text-anchor="end" letter-spacing="1.6">REQUEST PATH</text>
    <path class="wire" d="M706 96 H946"/>
    <path class="flow" d="M706 96 H946"/>
    <rect x="680" y="82" width="52" height="28" rx="6" fill="#10151c" stroke="#232b36"/>
    <text class="m fg2" x="706" y="100" font-size="8.5" text-anchor="middle">client</text>
    <rect x="760" y="82" width="52" height="28" rx="6" fill="#10151c" stroke="#232b36"/>
    <text class="m fg2" x="786" y="100" font-size="8.5" text-anchor="middle">api</text>
    <rect x="840" y="82" width="52" height="28" rx="6" fill="#10151c" stroke="#232b36"/>
    <text class="m fg2" x="866" y="100" font-size="8.5" text-anchor="middle">worker</text>
    <rect x="920" y="82" width="52" height="28" rx="6" fill="#10151c" stroke="#232b36"/>
    <text class="m fg2" x="946" y="100" font-size="8.5" text-anchor="middle">store</text>
    <circle class="dot" cx="706" cy="96" r="3" fill="#58a6ff"/>
    <circle class="dot" cx="706" cy="96" r="3" fill="#3fb950" style="animation-delay:1.7s"/>
    <text class="m fg3" x="826" y="132" font-size="9" text-anchor="middle">queue work off the request path</text>
  </g>
  <g class="fade" style="animation-delay:.7s">
    <text class="m fg3" x="978" y="176" font-size="9" text-anchor="end" letter-spacing="1.4">RECENT PUSH DAYS</text>
    <rect x="932.0" y="201.3" width="12" height="14.7" rx="2" fill="#58a6ff" fill-opacity="0.48"/>
    <rect x="949.0" y="192.7" width="12" height="23.3" rx="2" fill="#58a6ff" fill-opacity="0.67"/>
    <rect x="966.0" y="184.0" width="12" height="32.0" rx="2" fill="#58a6ff" fill-opacity="0.85"/>
  </g>
</svg>
