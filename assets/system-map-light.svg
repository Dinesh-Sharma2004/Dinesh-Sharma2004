<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 418" width="1000" height="418" role="img" aria-labelledby="t">
  <title id="t">Developer system map</title>
  <style>

    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif; }
    .m { font-family: ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .fg { fill: #1f2328; } .fg2 { fill: #59636e; } .fg3 { fill: #818b98; }
    .ac { fill: #0969da; } .gr { fill: #1a7f37; } .am { fill: #9a6700; }
    .b { font-weight: 650; }
    .card { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
    .rule { stroke: #e4e8ed; stroke-width: 1; }
    .wire { fill: none; stroke: #d1d9e0; stroke-width: 1.25; }
    .flow { fill: none; stroke: #0969da; stroke-width: 1.25;
             stroke-opacity: .5; stroke-dasharray: 3 7;
             animation: flow 1.9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .rise { opacity: 1; animation: rise .7s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); }
                       to   { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 1; animation: fade .8s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .95; } 50% { opacity: .35; } }
    .halo { animation: halo 2.8s ease-in-out infinite; }
    @keyframes halo { 0% { r: 4; opacity: .55; }
                       70%,100% { r: 11; opacity: 0; } }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 0;
             animation: draw 1.6s ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 1200; }
                       to { stroke-dashoffset: 0; } }
    .caret { animation: caret 1.05s steps(1) infinite; }
    @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .rise, .fade, .pulse, .halo, .draw, .caret, .sweep, .typer, .dot
        { animation: none !important; }
      .halo { opacity: 0; }
    }

    .sweep { animation: sweep 7s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes sweep { 0% { transform: translateX(0); }
                        60%,100% { transform: translateX(1320px); } }

    .node { animation: node 3.6s ease-in-out infinite; }
    @keyframes node { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .45; } }

  </style>
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0969da" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#eaeef2"/>
    </pattern>
  </defs>
  <rect width="1000" height="418" rx="10" fill="url(#pg)"/>
  <rect width="1000" height="418" rx="10" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="999" height="417" rx="9.5"
        fill="none" stroke="#d1d9e0"/>
  <g clip-path="inset(0 round 10px)">
    <rect class="sweep" x="-320" y="0" width="320" height="1.5" fill="url(#sweep)"/>
  </g>
  <text class="m b fg2" x="22" y="30" font-size="11.5" letter-spacing="2.4">DEVELOPER SYSTEM MAP</text>
  <text class="m fg3" x="978" y="30" font-size="10.5" text-anchor="end">derived from repository contents</text>
  <line class="rule" x1="22" y1="42" x2="978" y2="42"/>
  <rect class="card fade" x="395.0" y="58" width="210" height="36" rx="8"/>
  <text class="m b" x="500.0" y="81" font-size="11.5" text-anchor="middle" fill="#1f2328" letter-spacing="2">WHAT I BUILD</text>
  <path class="wire draw" d="M500.0 94 V126 H135.2 M135.2 126 H864.8"/>
  <path class="flow" d="M500.0 94 V126"/>
  <path class="wire" d="M135.2 126 V142"/>
  <path class="flow" d="M135.2 126 V142" style="animation-delay:0.00s"/>
  <circle cx="135.2" cy="126" r="2.6" fill="#0969da" fill-opacity=".75"/>
  <path class="wire" d="M317.6 126 V142"/>
  <path class="flow" d="M317.6 126 V142" style="animation-delay:0.18s"/>
  <circle cx="317.6" cy="126" r="2.6" fill="#0969da" fill-opacity=".75"/>
  <path class="wire" d="M500.0 126 V142"/>
  <path class="flow" d="M500.0 126 V142" style="animation-delay:0.36s"/>
  <circle cx="500.0" cy="126" r="2.6" fill="#0969da" fill-opacity=".75"/>
  <path class="wire" d="M682.4 126 V142"/>
  <path class="flow" d="M682.4 126 V142" style="animation-delay:0.54s"/>
  <circle cx="682.4" cy="126" r="2.6" fill="#0969da" fill-opacity=".75"/>
  <path class="wire" d="M864.8 126 V142"/>
  <path class="flow" d="M864.8 126 V142" style="animation-delay:0.72s"/>
  <circle cx="864.8" cy="126" r="2.6" fill="#0969da" fill-opacity=".75"/>
  <g class="rise" style="animation-delay:0.10s">
    <rect class="card node" x="53.0" y="142" width="164.4" height="34" rx="7" style="animation-delay:0.00s"/>
    <text class="m b" x="135.2" y="164" font-size="9.8" text-anchor="middle" fill="#1f2328" letter-spacing="1.1">AI / ML SYSTEMS</text>
    <circle class="pulse" cx="63.0" cy="196" r="2" fill="#0969da" style="animation-delay:0.00s"/>
    <text class="m" x="73.0" y="200" font-size="10" fill="#59636e">RAG pipelines</text>
    <circle class="pulse" cx="63.0" cy="218" r="2" fill="#0969da" style="animation-delay:0.30s"/>
    <text class="m" x="73.0" y="222" font-size="10" fill="#59636e">LLM agents</text>
    <circle class="pulse" cx="63.0" cy="240" r="2" fill="#0969da" style="animation-delay:0.60s"/>
    <text class="m" x="73.0" y="244" font-size="10" fill="#59636e">Eval harnesses</text>
    <text class="m fg3" x="73.0" y="274" font-size="8.5">5 repos</text>
    <path class="wire" d="M135.2 284 V276"/>
  </g>
  <g class="rise" style="animation-delay:0.18s">
    <rect class="card node" x="235.4" y="142" width="164.4" height="34" rx="7" style="animation-delay:0.40s"/>
    <text class="m b" x="317.6" y="164" font-size="9.8" text-anchor="middle" fill="#1f2328" letter-spacing="1.1">BACKEND SERVICES</text>
    <circle class="pulse" cx="245.4" cy="196" r="2" fill="#0969da" style="animation-delay:0.30s"/>
    <text class="m" x="255.4" y="200" font-size="10" fill="#59636e">FastAPI APIs</text>
    <circle class="pulse" cx="245.4" cy="218" r="2" fill="#0969da" style="animation-delay:0.60s"/>
    <text class="m" x="255.4" y="222" font-size="10" fill="#59636e">Queues &amp; workers</text>
    <circle class="pulse" cx="245.4" cy="240" r="2" fill="#0969da" style="animation-delay:0.90s"/>
    <text class="m" x="255.4" y="244" font-size="10" fill="#59636e">State machines</text>
    <text class="m fg3" x="255.4" y="274" font-size="8.5">4 repos</text>
    <path class="wire" d="M317.6 284 V276"/>
  </g>
  <g class="rise" style="animation-delay:0.26s">
    <rect class="card node" x="417.8" y="142" width="164.4" height="34" rx="7" style="animation-delay:0.80s"/>
    <text class="m b" x="500.0" y="164" font-size="9.8" text-anchor="middle" fill="#1f2328" letter-spacing="1.1">DATA &amp; RETRIEVAL</text>
    <circle class="pulse" cx="427.8" cy="196" r="2" fill="#0969da" style="animation-delay:0.60s"/>
    <text class="m" x="437.8" y="200" font-size="10" fill="#59636e">Vector search</text>
    <circle class="pulse" cx="427.8" cy="218" r="2" fill="#0969da" style="animation-delay:0.90s"/>
    <text class="m" x="437.8" y="222" font-size="10" fill="#59636e">Scrapers &amp; ETL</text>
    <circle class="pulse" cx="427.8" cy="240" r="2" fill="#0969da" style="animation-delay:1.20s"/>
    <text class="m" x="437.8" y="244" font-size="10" fill="#59636e">Cache layers</text>
    <text class="m fg3" x="437.8" y="274" font-size="8.5">4 repos</text>
    <path class="wire" d="M500.0 284 V276"/>
  </g>
  <g class="rise" style="animation-delay:0.34s">
    <rect class="card node" x="600.2" y="142" width="164.4" height="34" rx="7" style="animation-delay:1.20s"/>
    <text class="m b" x="682.4" y="164" font-size="9.8" text-anchor="middle" fill="#1f2328" letter-spacing="1.1">INFRA &amp; DELIVERY</text>
    <circle class="pulse" cx="610.2" cy="196" r="2" fill="#0969da" style="animation-delay:0.90s"/>
    <text class="m" x="620.2" y="200" font-size="10" fill="#59636e">Docker &amp; K8s</text>
    <circle class="pulse" cx="610.2" cy="218" r="2" fill="#0969da" style="animation-delay:1.20s"/>
    <text class="m" x="620.2" y="222" font-size="10" fill="#59636e">CI/CD</text>
    <circle class="pulse" cx="610.2" cy="240" r="2" fill="#0969da" style="animation-delay:1.50s"/>
    <text class="m" x="620.2" y="244" font-size="10" fill="#59636e">Metrics &amp; alerts</text>
    <text class="m fg3" x="620.2" y="274" font-size="8.5">4 repos</text>
    <path class="wire" d="M682.4 284 V276"/>
  </g>
  <g class="rise" style="animation-delay:0.42s">
    <rect class="card node" x="782.6" y="142" width="164.4" height="34" rx="7" style="animation-delay:1.60s"/>
    <text class="m b" x="864.8" y="164" font-size="9.8" text-anchor="middle" fill="#1f2328" letter-spacing="1.1">INTERFACES</text>
    <circle class="pulse" cx="792.6" cy="196" r="2" fill="#0969da" style="animation-delay:1.20s"/>
    <text class="m" x="802.6" y="200" font-size="10" fill="#59636e">React dashboards</text>
    <circle class="pulse" cx="792.6" cy="218" r="2" fill="#0969da" style="animation-delay:1.50s"/>
    <text class="m" x="802.6" y="222" font-size="10" fill="#59636e">Streaming UIs</text>
    <circle class="pulse" cx="792.6" cy="240" r="2" fill="#0969da" style="animation-delay:1.80s"/>
    <text class="m" x="802.6" y="244" font-size="10" fill="#59636e">Bots &amp; CLIs</text>
    <text class="m fg3" x="802.6" y="274" font-size="8.5">5 repos</text>
    <path class="wire" d="M864.8 284 V276"/>
  </g>
  <path class="wire draw" d="M135.2 276 H864.8" style="animation-delay:.3s"/>
  <path class="wire" d="M500.0 276 V300"/>
  <path class="flow" d="M500.0 276 V300"/>
  <rect class="card fade" x="350.0" y="300" width="300" height="40" rx="8" style="animation-delay:.45s"/>
  <rect x="350.0" y="300" width="300" height="2" rx="1" fill="#1a7f37" fill-opacity=".7"/>
  <text class="m b" x="500.0" y="325" font-size="11.5" text-anchor="middle" fill="#1f2328" letter-spacing="2">DEPLOYED APPLICATIONS</text>
  <text class="m fg3" x="500.0" y="362" font-size="9.5" text-anchor="middle" letter-spacing=".6">Docker  Render  Vercel  Fly.io  Kubernetes</text>
</svg>
