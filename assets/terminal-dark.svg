<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 432" width="1000" height="432" role="img" aria-labelledby="t">
  <title id="t">Terminal summary</title>
  <style>

    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif; }
    .m { font-family: ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .fg { fill: #e6edf3; } .fg2 { fill: #9198a1; } .fg3 { fill: #636c76; }
    .ac { fill: #58a6ff; } .gr { fill: #3fb950; } .am { fill: #d29922; }
    .b { font-weight: 650; }
    .card { fill: #10151c; stroke: #232b36; stroke-width: 1; }
    .rule { stroke: #1c232d; stroke-width: 1; }
    .wire { fill: none; stroke: #232b36; stroke-width: 1.25; }
    .flow { fill: none; stroke: #58a6ff; stroke-width: 1.25;
             stroke-opacity: .5; stroke-dasharray: 3 7;
             animation: flow 1.9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .rise { opacity: 1; animation: rise .7s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); }
                       to   { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 1; animation: fade .8s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .95; } 50% { opacity: .35; } }
    .halo { animation: halo 2.8s ease-in-out infinite; }
    @keyframes halo { 0% { r: 4; opacity: .55; }
                       70%,100% { r: 11; opacity: 0; } }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 0;
             animation: draw 1.6s ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 1200; }
                       to { stroke-dashoffset: 0; } }
    .caret { animation: caret 1.05s steps(1) infinite; }
    @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .rise, .fade, .pulse, .halo, .draw, .caret, .sweep, .typer, .dot
        { animation: none !important; }
      .halo { opacity: 0; }
    }

    .sweep { animation: sweep 7s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes sweep { 0% { transform: translateX(0); }
                        60%,100% { transform: translateX(1320px); } }

    .ln { animation: fade .5s ease-out both; }

  </style>
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#161c24"/>
    </pattern>
  </defs>
  <rect width="1000" height="432" rx="10" fill="url(#pg)"/>
  <rect width="1000" height="432" rx="10" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="999" height="431" rx="9.5"
        fill="none" stroke="#232b36"/>
  <g clip-path="inset(0 round 10px)">
    <rect class="sweep" x="-320" y="0" width="320" height="1.5" fill="url(#sweep)"/>
  </g>
  <path class="wire" d="M1 34 H999"/>
  <circle cx="24" cy="18" r="5" fill="#ff5f57" fill-opacity=".85"/>
  <circle cx="41" cy="18" r="5" fill="#febc2e" fill-opacity=".85"/>
  <circle cx="58" cy="18" r="5" fill="#28c840" fill-opacity=".85"/>
  <text class="m fg3" x="500.0" y="22" font-size="10.5" text-anchor="middle">Dinesh-Sharma2004@github: ~/profile</text>
  <text class="m fg3" x="978" y="22" font-size="9.5" text-anchor="end">bash</text>
  <g class="ln" style="animation-delay:0.19s">
    <text class="m b" x="22" y="54" font-size="12" fill="#3fb950">$</text>
    <text class="m" x="42" y="54" font-size="12" fill="#e6edf3">whoami</text>
  </g>
  <text class="m ln" x="42" y="74" font-size="11" fill="#9198a1" xml:space="preserve" style="animation-delay:0.28s">Dinesh-Sharma2004  (Backend &amp; AI systems engineer)</text>
  <g class="ln" style="animation-delay:0.37s">
    <text class="m b" x="22" y="104" font-size="12" fill="#3fb950">$</text>
    <text class="m" x="42" y="104" font-size="12" fill="#e6edf3">ls domains/</text>
  </g>
  <text class="m ln" x="42" y="124" font-size="11" fill="#9198a1" xml:space="preserve" style="animation-delay:0.46s">ai-ml-systems/   backend-services/   data-retrieval/</text>
  <text class="m ln" x="42" y="144" font-size="11" fill="#9198a1" xml:space="preserve" style="animation-delay:0.55s">infra-delivery/   interfaces/</text>
  <g class="ln" style="animation-delay:0.64s">
    <text class="m b" x="22" y="174" font-size="12" fill="#3fb950">$</text>
    <text class="m" x="42" y="174" font-size="12" fill="#e6edf3">cat current_work</text>
  </g>
  <g class="ln" style="animation-delay:0.73s">
    <text class="m b" x="42" y="194" font-size="11" fill="#3fb950">[ACTIVE]</text>
    <text class="m" x="128" y="194" font-size="11" fill="#9198a1" xml:space="preserve">Medical_chatbot       LangChain . FAISS . Hugging Face</text>
  </g>
  <g class="ln" style="animation-delay:0.82s">
    <text class="m b" x="42" y="214" font-size="11" fill="#3fb950">[ACTIVE]</text>
    <text class="m" x="128" y="214" font-size="11" fill="#9198a1" xml:space="preserve">Regime-Aware-Time-Series-Forecasting-Systemscikit-learn . LightGBM . NumPy</text>
  </g>
  <g class="ln" style="animation-delay:0.91s">
    <text class="m b" x="42" y="234" font-size="11" fill="#3fb950">[ACTIVE]</text>
    <text class="m" x="128" y="234" font-size="11" fill="#9198a1" xml:space="preserve">TripCaspian           APScheduler . SQLAlchemy . Docker</text>
  </g>
  <g class="ln" style="animation-delay:1.00s">
    <text class="m b" x="22" y="264" font-size="12" fill="#3fb950">$</text>
    <text class="m" x="42" y="264" font-size="12" fill="#e6edf3">git log --all --oneline -1</text>
  </g>
  <text class="m ln" x="42" y="284" font-size="11" fill="#9198a1" xml:space="preserve" style="animation-delay:1.09s">2026-09-01  Medical_chatbot  (most recent public push)</text>
  <g class="ln" style="animation-delay:1.18s">
    <text class="m b" x="22" y="314" font-size="12" fill="#3fb950">$</text>
    <text class="m" x="42" y="314" font-size="12" fill="#e6edf3">git status</text>
  </g>
  <text class="m ln" x="42" y="334" font-size="11" fill="#9198a1" xml:space="preserve" style="animation-delay:1.27s">4 repositories touched in the last 30 days . 379 contributions in the last 365</text>
  <text class="m ln" x="42" y="354" font-size="11" fill="#9198a1" xml:space="preserve" style="animation-delay:1.36s">working tree: building</text>
  <text class="m b" x="22" y="374" font-size="12" fill="#3fb950">$</text>
  <rect class="caret" x="42" y="363" width="8" height="14" fill="#58a6ff"/>
</svg>
