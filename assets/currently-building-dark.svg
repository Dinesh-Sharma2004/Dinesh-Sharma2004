    <rect x="365.3" y="174.0" width="62.6" height="17" rx="4" fill="none" stroke="#232b36"/>
    <text class="m fg3" x="372.3" y="186.0" font-size="9">LangChain</text>
    <rect x="433.9" y="174.0" width="41.0" height="17" rx="4" fill="none" stroke="#232b36"/>
    <text class="m fg3" x="440.9" y="186.0" font-size="9">FAISS</text>
