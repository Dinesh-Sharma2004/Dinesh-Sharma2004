<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 422" width="1000" height="422" role="img" aria-labelledby="t">
  <title id="t">Developer timeline</title>
  <style>

    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif; }
    .m { font-family: ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .fg { fill: #e6edf3; } .fg2 { fill: #9198a1; } .fg3 { fill: #636c76; }
    .ac { fill: #58a6ff; } .gr { fill: #3fb950; } .am { fill: #d29922; }
    .b { font-weight: 650; }
    .card { fill: #10151c; stroke: #232b36; stroke-width: 1; }
    .rule { stroke: #1c232d; stroke-width: 1; }
    .wire { fill: none; stroke: #232b36; stroke-width: 1.25; }
    .flow { fill: none; stroke: #58a6ff; stroke-width: 1.25;
             stroke-opacity: .5; stroke-dasharray: 3 7;
             animation: flow 1.9s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .rise { opacity: 1; animation: rise .7s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); }
                       to   { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 1; animation: fade .8s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .95; } 50% { opacity: .35; } }
    .halo { animation: halo 2.8s ease-in-out infinite; }
    @keyframes halo { 0% { r: 4; opacity: .55; }
                       70%,100% { r: 11; opacity: 0; } }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 0;
             animation: draw 1.6s ease-out both; }
    @keyframes draw { from { stroke-dashoffset: 1200; }
                       to { stroke-dashoffset: 0; } }
    .caret { animation: caret 1.05s steps(1) infinite; }
    @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .rise, .fade, .pulse, .halo, .draw, .caret, .sweep, .typer, .dot
        { animation: none !important; }
      .halo { opacity: 0; }
    }

    .sweep { animation: sweep 7s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes sweep { 0% { transform: translateX(0); }
                        60%,100% { transform: translateX(1320px); } }

    .spine { stroke-dasharray: 422; animation: spine 1.8s ease-out both; }
    @keyframes spine { from { stroke-dashoffset: 422; }
                        to { stroke-dashoffset: 0; } }
    .slide { animation: slide .6s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes slide { from { opacity: 0; transform: translateX(-8px); }
                        to { opacity: 1; transform: translateX(0); } }

  </style>
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#161c24"/>
    </pattern>
  </defs>
  <rect width="1000" height="422" rx="10" fill="url(#pg)"/>
  <rect width="1000" height="422" rx="10" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="999" height="421" rx="9.5"
        fill="none" stroke="#232b36"/>
  <g clip-path="inset(0 round 10px)">
    <rect class="sweep" x="-320" y="0" width="320" height="1.5" fill="url(#sweep)"/>
  </g>
  <text class="m b fg2" x="22" y="30" font-size="11.5" letter-spacing="2.4">DEVELOPER TIMELINE</text>
  <text class="m fg3" x="978" y="30" font-size="10.5" text-anchor="end">from repository create / push dates</text>
  <line class="rule" x1="22" y1="42" x2="978" y2="42"/>
  <path class="wire spine" d="M132 54 V388" stroke-width="1.5"/>
  <g class="slide" style="animation-delay:0.05s">
    <text class="m b" x="108" y="68" font-size="15" text-anchor="end" fill="#e6edf3" letter-spacing="1">2025</text>
    <rect x="127" y="58" width="10" height="10" rx="2" fill="#58a6ff"/>
    <line class="rule" x1="150" y1="63" x2="976" y2="63"/>
  </g>
  <g class="slide" style="animation-delay:0.10s">
    <text class="m fg3" x="108" y="100" font-size="9.5" text-anchor="end">03-19</text>
    <circle cx="132" cy="96" r="3.4" fill="#10151c" stroke="#58a6ff" stroke-width="1.6"/>
    <path class="wire" d="M138 96 H154"/>
    <text class="m b" x="162" y="100" font-size="9" fill="#58a6ff" letter-spacing="1.1">STARTED</text>
    <text class="m" x="240" y="100" font-size="11.5" fill="#e6edf3">Medical_chatbot</text>
    <text x="362" y="100" font-size="10" fill="#636c76">PDF-grounded RAG service with off-path ingestion workers</text>
  </g>
  <g class="slide" style="animation-delay:0.15s">
    <text class="m fg3" x="108" y="130" font-size="9.5" text-anchor="end">05-29</text>
    <circle cx="132" cy="126" r="3.4" fill="#10151c" stroke="#58a6ff" stroke-width="1.6"/>
    <path class="wire" d="M138 126 H154"/>
    <text class="m b" x="162" y="130" font-size="9" fill="#58a6ff" letter-spacing="1.1">STARTED</text>
    <text class="m" x="240" y="130" font-size="11.5" fill="#e6edf3">tweeter-assistant</text>
    <text x="375" y="130" font-size="10" fill="#636c76">Gemini-backed agent that drafts and posts tweets</text>
  </g>
  <g class="slide" style="animation-delay:0.20s">
    <text class="m fg3" x="108" y="160" font-size="9.5" text-anchor="end">09-21</text>
    <circle cx="132" cy="156" r="3.4" fill="#10151c" stroke="#58a6ff" stroke-width="1.6"/>
    <path class="wire" d="M138 156 H154"/>
    <text class="m b" x="162" y="160" font-size="9" fill="#58a6ff" letter-spacing="1.1">STARTED</text>
    <text class="m" x="240" y="160" font-size="11.5" fill="#e6edf3">ML_Algorithm_from_scratch</text>
    <text x="430" y="160" font-size="10" fill="#636c76">Classical ML algorithms implemented from NumPy up</text>
  </g>
  <g class="slide" style="animation-delay:0.25s">
    <text class="m fg3" x="108" y="190" font-size="9.5" text-anchor="end">12-13</text>
    <circle cx="132" cy="186" r="3.4" fill="#10151c" stroke="#58a6ff" stroke-width="1.6"/>
    <path class="wire" d="M138 186 H154"/>
    <text class="m b" x="162" y="190" font-size="9" fill="#58a6ff" letter-spacing="1.1">STARTED</text>
    <text class="m" x="240" y="190" font-size="11.5" fill="#e6edf3">Trading-bot</text>
    <text x="334" y="190" font-size="10" fill="#636c76">Binance futures execution with a live React dashboard</text>
  </g>
  <g class="slide" style="animation-delay:0.30s">
    <text class="m b" x="108" y="222" font-size="15" text-anchor="end" fill="#e6edf3" letter-spacing="1">2026</text>
    <rect x="127" y="212" width="10" height="10" rx="2" fill="#58a6ff"/>
    <line class="rule" x1="150" y1="217" x2="976" y2="217"/>
  </g>
  <g class="slide" style="animation-delay:0.35s">
    <text class="m fg3" x="108" y="254" font-size="9.5" text-anchor="end">02-14</text>
    <circle cx="132" cy="250" r="3.4" fill="#10151c" stroke="#58a6ff" stroke-width="1.6"/>
    <path class="wire" d="M138 250 H154"/>
    <text class="m b" x="162" y="254" font-size="9" fill="#58a6ff" letter-spacing="1.1">STARTED</text>
    <text class="m" x="240" y="254" font-size="11.5" fill="#e6edf3">FactLens</text>
    <text x="313" y="254" font-size="10" fill="#636c76">Streaming claim verification with cache-first retrieval</text>
  </g>
  <g class="slide" style="animation-delay:0.40s">
    <text class="m fg3" x="108" y="284" font-size="9.5" text-anchor="end">06-20</text>
    <circle cx="132" cy="280" r="3.4" fill="#10151c" stroke="#58a6ff" stroke-width="1.6"/>
    <path class="wire" d="M138 280 H154"/>
    <text class="m b" x="162" y="284" font-size="9" fill="#58a6ff" letter-spacing="1.1">STARTED</text>
    <text class="m" x="240" y="284" font-size="11.5" fill="#e6edf3">HLE-Benchmark-Test</text>
    <text x="382" y="284" font-size="10" fill="#636c76">Resumable multi-model LLM evaluation harness</text>
  </g>
  <g class="slide" style="animation-delay:0.45s">
    <text class="m fg3" x="108" y="314" font-size="9.5" text-anchor="end">07-22</text>
    <circle cx="132" cy="310" r="3.4" fill="#10151c" stroke="#58a6ff" stroke-width="1.6"/>
    <path class="wire" d="M138 310 H154"/>
    <text class="m b" x="162" y="314" font-size="9" fill="#58a6ff" letter-spacing="1.1">STARTED</text>
    <text class="m" x="240" y="314" font-size="11.5" fill="#e6edf3">KYC_Face_Verifier</text>
    <text x="375" y="314" font-size="10" fill="#636c76">Document + face verification behind an async job pipeline</text>
  </g>
  <g class="slide" style="animation-delay:0.50s">
    <text class="m fg3" x="108" y="344" font-size="9.5" text-anchor="end">07-27</text>
    <circle cx="132" cy="340" r="3.4" fill="#10151c" stroke="#58a6ff" stroke-width="1.6"/>
    <path class="wire" d="M138 340 H154"/>
    <text class="m b" x="162" y="344" font-size="9" fill="#58a6ff" letter-spacing="1.1">STARTED</text>
    <text class="m" x="240" y="344" font-size="11.5" fill="#e6edf3">TripCaspian</text>
    <text x="334" y="344" font-size="10" fill="#636c76">Conversational commitments turned into tracked obligations</text>
  </g>
  <g class="slide" style="animation-delay:0.60s">
    <text class="m b fg2" x="108" y="376" font-size="10" text-anchor="end" letter-spacing="1.4">NOW</text>
    <circle class="halo" cx="132" cy="371" r="4" fill="#3fb950" style="animation-delay:0s"/>
    <circle class="pulse" cx="132" cy="371" r="3.2" fill="#3fb950" style="animation-delay:0s"/>
    <path class="wire" d="M140 371 H154"/>
    <text class="m" x="162" y="375" font-size="11.5" fill="#e6edf3">Medical_chatbot</text>
    <text x="284" y="375" font-size="10.5" fill="#9198a1">PDF-grounded RAG service with off-path ingestion workers</text>
  </g>
</svg>
