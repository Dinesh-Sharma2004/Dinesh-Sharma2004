<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <style>
    .ascii {
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 10px;
      font-weight: bold;
      fill: url(#glint-grad);
      white-space: pre;
    }
    .bg {
      fill: #0d1117;
    }
  </style>
  <rect width="100%" height="100%" class="bg" />
  
  <defs>
    <!-- Linear gradient with moving highlight/glint swept in sync with reveal -->
    <linearGradient id="glint-grad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="40%" stop-color="#3fb950" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#3fb950" />
      <animateTransform attributeName="gradientTransform"
                        type="translate"
                        values="-1200,0; 1200,0; 1200,0; -1200,0"
                        keyTimes="0; 0.4; 0.9; 1"
                        dur="7s"
                        repeatCount="indefinite" />
    </linearGradient>

    <!-- Clip path to reveal the sword left-to-right over 2.8s (40% of 7s) -->
    <clipPath id="reveal-clip">
      <rect x="0" y="0" width="0" height="200">
        <animate attributeName="width"
                 values="0; 1200; 1200; 0"
                 keyTimes="0; 0.4; 0.9; 1"
                 dur="7s"
                 repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Perfectly Centered Symmetrical Skull with Wide Mouth and Left-Shifted Jaw -->
  <g clip-path="url(#reveal-clip)">
    <text x="111" y="30" class="ascii">                                                 &quot;.____.</text>
    <text x="111" y="43" class="ascii">          /) ( ~ )  ( ~ )  ( ~ )  ( ~ )  ~      ,-^       ^-.      ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )</text>
    <text x="111" y="56" class="ascii">         //   ) ~ (  ) ~ (  ) ~ (  ) ~ ( !()   ~/            \    ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (</text>
    <text x="111" y="69" class="ascii">.-------| |--------------------------------/  _         _   \------------------------------------------------------------------------------------------------------.__</text>
    <text x="111" y="82" class="ascii">|WMWMWMW| |&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt; | / $\      / $\ |&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;&gt;:&gt;</text>
    <text x="111" y="95" class="ascii">`-------| |---------------------------------| \_$/      \_$/ |----------------------------------------------------------------------------------------------------&apos;^^</text>
    <text x="111" y="108" class="ascii">         \\ ) ~ (  ) ~ (  ) ~ (  ) ~ (      \     //\     /    ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (  ) ~ (</text>
    <text x="111" y="121" class="ascii">          \) ( ~ )  ( ~ )  ( ~ )  ( ~ )      \    \_/    /      ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )  ( ~ )</text>
    <text x="111" y="134" class="ascii">                                              |          |</text>
    <text x="111" y="147" class="ascii">                                              |+H+H+H+H+H|</text>
    <text x="111" y="160" class="ascii">                                              \        //</text>
    <text x="111" y="173" class="ascii">                                               ^-------^</text>
  </g>
</svg>
