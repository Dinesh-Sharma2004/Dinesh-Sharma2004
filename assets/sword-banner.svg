<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 110" width="100%" height="100%">
  <style>
    .ascii {
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 9px;
      font-weight: bold;
      fill: url(#glint-grad);
      white-space: pre;
    }
    .bg {
      fill: #0d1117;
    }
  </style>
  <rect width="100%" height="100%" class="bg" />
  
  <defs>
    <!-- Linear gradient with moving highlight/glint swept in sync with reveal -->
    <linearGradient id="glint-grad" x1="0" y1="0" x2="660" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="40%" stop-color="#3fb950" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#3fb950" />
      <animateTransform attributeName="gradientTransform"
                        type="translate"
                        values="-660,0; 660,0; 660,0; -660,0"
                        keyTimes="0; 0.4; 0.9; 1"
                        dur="7s"
                        repeatCount="indefinite" />
    </linearGradient>

    <!-- Clip path to reveal the sword left-to-right over 2.8s (40% of 7s) -->
    <clipPath id="reveal-clip">
      <rect x="0" y="0" width="0" height="120">
        <animate attributeName="width"
                 values="0; 660; 660; 0"
                 keyTimes="0; 0.4; 0.9; 1"
                 dur="7s"
                 repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Sword ASCII art rendered line by line with perfect character spacing and 30:5 aspect ratio -->
  <g clip-path="url(#reveal-clip)">
    <text x="15" y="10.25" class="ascii">__________</text>
    <text x="15" y="19.75" class="ascii">             ./&apos; .v~  ,---.    ___   _____   ,----    ,---.   |   |</text>
    <text x="15" y="29.25" class="ascii">           ./  .(W-- /     \    |   |\.  /|  |       (        |   |</text>
    <text x="15" y="38.75" class="ascii">          ,|  /&lt;M.  |           |   | \  |   |----    `--.    |___|</text>
    <text x="15" y="48.25" class="ascii">\~b__________/$@|\--|-----------|---|--\-|---|------------.---|---|-</text>
    <text x="15" y="57.75" class="ascii"> &gt;@)$$$$$$$$($( )#H&gt;===D=======I=======N=======E=======S=======H====</text>
    <text x="15" y="67.25" class="ascii">/_p~~~~~~~~~~\$@|/--|-----------|---|--/-|---|-------.--------|---|-</text>
    <text x="15" y="76.75" class="ascii">          `|  \&lt;M`  |           |   | /  |   |----      `-/   |   |</text>
    <text x="15" y="86.25" class="ascii">           `\  `(B-- \     /    |   |/  .\|  |            )   |   |</text>
    <text x="15" y="95.75" class="ascii">             `\  `?_  `---&apos;    ---   `---&apos;   `----    `---&apos;   &apos;   &apos;</text>
    <text x="15" y="105.25" class="ascii">               `~~~~ ~~~~~~~ ~~~~~~~ ~~~~~~~ ~~~~~~~ ~~~~~~~ ~~~~~~~</text>
  </g>
</svg>
